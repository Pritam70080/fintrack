server:
  port: 8000
  servlet.context-path: /api/v1

spring:
  application:
    name: fintrack

  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack
    username: db_username
    password: db_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_USERNAME}
  frontend-url: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000