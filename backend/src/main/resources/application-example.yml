server:
  port: 8000
  servlet.context-path: /api/v1

spring:
  application:
    name: fintrack

  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack
    username: db_username
    password: db_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
